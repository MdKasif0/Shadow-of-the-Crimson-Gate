<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shadow of the Crimson Gate — A cinematic Japanese fantasy 2D action game. Unsheathe your blade and enter a world of yokai, spirits, and ancient mysteries." />
    <meta name="theme-color" content="#0a0a0a" />

    <title>Shadow of the Crimson Gate</title>

    <!-- Preconnect to Google Fonts for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Display font: Cinzel (elegant, serif, fantasy-appropriate) -->
    <!-- UI font: Inter (clean, modern sans-serif) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Preload hero background for fast LCP -->
    <link
      rel="preload"
      as="image"
      href="/assets/hero-bg-image.png"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
