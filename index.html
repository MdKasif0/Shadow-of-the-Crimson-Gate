<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shadow of the Crimson Gate — A cinematic Japanese fantasy action game. Unsheathe your blade and enter a world of yokai, spirits, and ancient mysteries." />
    <meta name="theme-color" content="#0a0a0a" />

    <title>Shadow of the Crimson Gate</title>

    <!-- Preconnect to Google Fonts for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Display font: Cinzel (elegant, serif, fantasy-appropriate) -->
    <!-- UI font: Inter (clean, modern sans-serif) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Preload hero background for fast LCP -->
    <link
      rel="preload"
      as="image"
      href="/assets/hero-gate.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- Inline so the boot screen appears before the stylesheets and scripts have loaded -->
    <style>
      html, body { margin: 0; background: #050507; }
      #boot-screen {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 24px; box-sizing: border-box;
        color: #e8e2d4; text-align: center; font-family: 'Cinzel', Georgia, serif;
        background: radial-gradient(ellipse at 50% 42%, #2a0b0e 0%, #0d0508 48%, #050507 100%);
        transition: opacity 0.9s ease;
      }
      #boot-screen.boot-screen--done { opacity: 0; pointer-events: none; }
      .boot-eyebrow { margin: 0 0 14px; font-size: 12px; letter-spacing: 0.5em; text-indent: 0.5em; color: #b53a3a; }
      .boot-title {
        margin: 0 0 44px; font-size: clamp(26px, 5vw, 52px); font-weight: 600;
        line-height: 1.2; letter-spacing: 0.14em; text-indent: 0.14em; text-wrap: balance;
      }
      #boot-track { width: min(360px, 70vw); height: 2px; overflow: hidden; background: rgba(232, 226, 212, 0.14); }
      #boot-bar {
        width: 100%; height: 100%; transform: scaleX(0); transform-origin: left;
        background: linear-gradient(90deg, #7a1515, #e0523a);
        box-shadow: 0 0 12px rgba(224, 82, 58, 0.7);
        transition: transform 0.25s ease-out;
      }
      .boot-status {
        display: flex; justify-content: space-between; gap: 24px;
        width: min(360px, 70vw); margin-top: 14px;
        font-size: 12px; letter-spacing: 0.14em; color: #a8a294;
      }
      #boot-message { text-align: left; }
      #boot-percent { font-variant-numeric: tabular-nums; }
      .boot-screen--error #boot-track, .boot-screen--error #boot-percent { display: none; }
      .boot-screen--error .boot-status { width: min(520px, 86vw); font-size: 14px; line-height: 1.7; letter-spacing: 0.04em; color: #e8e2d4; }
      .boot-screen--error #boot-message { text-align: center; }
      @media (prefers-reduced-motion: reduce) {
        #boot-screen, #boot-bar { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-screen">
      <p class="boot-eyebrow">鳥居の影</p>
      <h1 class="boot-title">Shadow of the Crimson Gate</h1>
      <div id="boot-track" role="progressbar" aria-label="Loading the game" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="boot-bar"></div>
      </div>
      <div class="boot-status">
        <span id="boot-message" aria-live="polite">Awakening the mountain</span>
        <span id="boot-percent">0%</span>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
